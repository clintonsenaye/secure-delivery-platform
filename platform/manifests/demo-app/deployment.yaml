---
# The demo service.
#
# This file is the one to edit during the rollback demonstration: change
# GREETING, commit, push, and watch the cluster follow. See docs/architecture.md
# section 21.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: secure-delivery-platform
spec:
  # Two replicas so a rolling update is visible on camera and so the two kind
  # workers both have something scheduled on them.
  replicas: 2
  # maxUnavailable 0 means the new pod must be Ready before an old one is
  # removed, so a rolling update never dips below the declared replica count.
  # On a two node cluster this needs maxSurge to be non-zero or the rollout
  # deadlocks with nowhere to put the surge pod.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # How long a new ReplicaSet has to become available before the Deployment is
  # marked failed. The default is 600s, which is a long time to watch a broken
  # rollout during a demonstration.
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
        app.kubernetes.io/part-of: secure-delivery-platform
      annotations:
        # Read by a Prometheus scrape config using the standard kubernetes_sd
        # pod role. Nothing scrapes these yet. They are here so that chapter 5
        # is a matter of installing Prometheus rather than editing every
        # workload in the repository.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # Pod level security context. Applies to every container in the pod and to
      # any volume the pod mounts.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          # RuntimeDefault applies the container runtime's default seccomp
          # filter, which blocks roughly forty rarely used syscalls that show up
          # far more often in exploits than in applications. Unconfined, which
          # is the default when this field is absent, blocks nothing.
          type: RuntimeDefault
      # Spread the two replicas across the two kind workers. whenUnsatisfiable
      # is ScheduleAnyway rather than DoNotSchedule, so a single node cluster
      # still schedules both pods instead of leaving one Pending forever. A
      # scheduling preference should degrade, not deadlock.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: demo-app
      # Chapter 3. A dedicated ServiceAccount, whose only job is to carry the
      # reference to the ECR pull secret so this file does not have to name a
      # registry credential. See serviceaccount.yaml for why that secret exists
      # on kind and disappears on EKS.
      serviceAccountName: demo-app
      # The default ServiceAccount token is mounted into every pod unless this
      # is set. This application never calls the Kubernetes API, so mounting a
      # credential for it hands an attacker a cluster credential for nothing in
      # return.
      automountServiceAccountToken: false
      # Long enough for the 15 second graceful shutdown in main.go to finish
      # with room to spare.
      terminationGracePeriodSeconds: 30
      containers:
        - name: demo-app
          ##################################################################
          # THIS LINE IS CHAPTER 3.
          #
          # It is written by .github/workflows/build-sign-attest.yml, which
          # PROPOSES this value, in a pull request, after the image has been
          # built, scanned, attested, signed and verified. A human merges it.
          # Nothing else edits this line, and nothing should.
          #
          # BY DIGEST, NEVER BY TAG. The whole chapter is in that distinction.
          #
          # In chapter 2 this said `demo-app:0.1.0`, an image side loaded into
          # the kind nodes from a laptop. Two things were wrong with it. The
          # first was that nothing verified those bytes at all. The second was
          # subtler and bit before the first did: rebuilding the image under the
          # same 0.1.0 tag left this file byte for byte identical, so Kubernetes
          # compared the pod template, saw no change, and did nothing. The pods
          # kept serving the old binary while every dashboard read Synced and
          # Healthy. The system was correct and the deployment was a lie.
          #
          # A tag is a pointer and pointers move. A digest is the SHA256 of the
          # image manifest, so it IS the content: change one byte and it is a
          # different name. Nothing can be repointed, no rebuild is invisible,
          # and the signature verified at admission is over these exact bytes
          # rather than over a label somebody could reassign.
          #
          # THE VALUE BELOW IS A PLACEHOLDER until the pipeline has run once.
          # `make argocd-up` checks for it and warns. On a fresh clone the
          # sequence is: apply the ci Terraform, push to main, let the workflow
          # finish, pull, and only then bring the cluster up.
          ##################################################################
          image: 466826557930.dkr.ecr.eu-west-2.amazonaws.com/secure-delivery-ci/app@sha256:fc48dc1f6bd8c714001d6a893c4737b070436deea51eb28db2fae0142f08183f
          # IfNotPresent is correct and cheap for a digest reference. A digest
          # already in the node's image store can only be the bytes that digest
          # names, so re-pulling could not possibly get anything different.
          # Always would be pure network cost for zero freshness benefit, which
          # is the opposite of the situation with a mutable tag.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # The rollback demonstration changes this value. It is the visible
            # thing that proves a git revert reached the cluster.
            - name: GREETING
              value: "Chapter 3: signed, attested, and verified at admission"
            # Downward API. The pod does not need cluster API access to learn
            # its own identity, so it is given it directly. This is what puts a
            # changing pod name on the greeting page during the self-healing
            # demonstration.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Reported at /version. Both values are written by the pipeline
            # alongside the image reference above, and they close a promise
            # chapter 2 made: /version shipped reporting image_digest as "unset",
            # with a comment saying chapter 3 would fill it in.
            #
            # HOW MUCH TO TRUST THIS ENDPOINT, precisely. These are environment
            # variables. The application reports what it was told, and a pod that
            # lies about its own provenance is trivial to construct. What makes
            # them meaningful is not the application, it is that they were
            # written by the same commit that ArgoCD applied and that Kyverno
            # verified the signature over the digest named here before the pod
            # was allowed to exist. The endpoint is a convenient window onto a
            # fact established elsewhere, not the evidence itself.
            #
            # The one provenance claim the application can make without trusting
            # anyone is binary_sha256, which it computes of itself at runtime by
            # reading /proc/self/exe.
            - name: IMAGE_REF
              value: 466826557930.dkr.ecr.eu-west-2.amazonaws.com/secure-delivery-ci/app@sha256:fc48dc1f6bd8c714001d6a893c4737b070436deea51eb28db2fae0142f08183f
            - name: IMAGE_DIGEST
              value: "sha256:fc48dc1f6bd8c714001d6a893c4737b070436deea51eb28db2fae0142f08183f"
          # Container level security context. The pod level one above cannot
          # express these, because they are properties of the container.
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            # A read only root filesystem turns "write a payload to disk and run
            # it" into an error. The application writes nothing, so this costs
            # nothing. A process that needs scratch space gets an emptyDir
            # rather than a writable root.
            readOnlyRootFilesystem: true
            capabilities:
              # Drop every Linux capability. Binding to port 8080 rather than 80
              # is what makes this possible: ports below 1024 would need
              # NET_BIND_SERVICE.
              drop: [ALL]
          # Requests are what the scheduler reserves; limits are what the
          # kernel enforces. Both are set because a workload without requests is
          # scheduled as though it were free, and a workload without limits can
          # starve its neighbours on a laptop sized cluster.
          #
          # No CPU limit is set on purpose. CPU limits throttle rather than kill,
          # and a throttled process under the CFS quota can see latency spikes
          # far worse than the contention the limit was meant to prevent. The
          # memory limit is set, because memory is not compressible and the only
          # remedy for exhausting it is the OOM killer.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          # Three probes, doing three different jobs. Conflating them is the
          # most common probe mistake.
          #
          # startup:   is it up yet? Suppresses the other two until it passes,
          #            so a slow start is not mistaken for a failure.
          # readiness: should it receive traffic? Failing removes the pod from
          #            the Service endpoints without killing it.
          # liveness:  is it wedged? Failing kills the container. This is the
          #            dangerous one: too aggressive and a slow dependency turns
          #            into a restart loop that makes the outage worse.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
