---
##############################################################################
# A dedicated ServiceAccount for the demo app. New in chapter 3.
#
# It exists for one reason: to carry the reference to the ECR pull secret, so the
# Deployment does not have to name a registry credential and stays
# registry agnostic.
#
# WHY THERE IS A PULL SECRET AT ALL, AND WHY IT IS A STEP BACKWARDS
#
# Chapter 2's credential inventory had three rows and the architecture document
# said, in bold, that there was no fourth. Chapter 3 adds one, and pretending
# otherwise would undo the credibility that table bought.
#
# The image now lives in ECR instead of being side loaded into kind. On EKS the
# kubelet pulls from ECR using the node's instance role, which is why
# docs/architecture.md section 8 could say Deployments have no imagePullSecrets
# at all. A kind node has no AWS identity, so it cannot do that. The stand in is
# a docker config secret built from `aws ecr get-login-password`, which is a real
# stored credential with a TWELVE HOUR lifetime.
#
#   make ecr-login      creates or refreshes it
#
# THE SECRET ITSELF IS NOT AND CANNOT BE IN GIT. It contains a bearer token. This
# file references a secret named `ecr-pull` that a human creates out of band,
# which means ArgoCD will happily sync this ServiceAccount into a cluster where
# that secret does not exist, and the pods will sit in ImagePullBackOff with an
# authentication error. That is a genuine hole in "Git is the whole truth", it is
# the same class of hole ArgoCD's CreateNamespace=true would have opened, and
# here there is no way to close it without a secret management tool. Sealed
# Secrets, SOPS with age, or the External Secrets Operator are the real answers
# and none is built. See docs/architecture.md section 27.
#
# ON EKS THIS ENTIRE FILE BECOMES UNNECESSARY.
##############################################################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: secure-delivery-platform

# The kubelet uses these to authenticate to the registry when pulling images for
# any pod using this ServiceAccount.
#
# Kyverno needs the same credential separately, in its own namespace, because it
# reads the SIGNATURE from the registry at admission time. Two copies of the same
# short lived token in two namespaces is not elegant. `make ecr-login` creates
# both, so at least they cannot fall out of step.
imagePullSecrets:
  - name: ecr-pull

# NOT a token mounting ServiceAccount.
#
# automountServiceAccountToken is false, and the Deployment sets it false as
# well. This ServiceAccount exists purely to hold a registry credential; the
# application never calls the Kubernetes API, so projecting a cluster credential
# into its pods would hand an attacker something for nothing.
#
# Setting it in both places is deliberate. The ServiceAccount setting is the
# default for anything using it; the pod setting is the guarantee for this
# workload. Neither is trusted alone, which is the same reasoning the Dockerfile
# gives for stating USER explicitly rather than relying on the :nonroot base tag.
automountServiceAccountToken: false
