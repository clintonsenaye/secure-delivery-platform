---
# Password policy and account lockout.
#
# Worth being honest about scope: because the SSH section disables password
# authentication entirely, these rules do not defend the remote login path. They
# apply to local console logins, sudo prompts and any service that authenticates
# against PAM. They are defence in depth, not the front line.

- name: Install PAM password quality and lockout modules
  ansible.builtin.apt:
    name:
      - libpam-pwquality
      - libpam-modules
    state: present

# Complexity rules. The negative credit values mean "require at least one of
# this class"; pwquality counts them as credits towards the minimum length.
- name: Configure password quality requirements
  ansible.builtin.template:
    src: pwquality.conf.j2
    dest: /etc/security/pwquality.conf
    owner: root
    group: root
    mode: "0644"

# Lockout after repeated failures. faillock replaced pam_tally2, which was
# removed in Ubuntu 22.04. Using the old module name here would silently do
# nothing.
- name: Configure account lockout
  ansible.builtin.template:
    src: faillock.conf.j2
    dest: /etc/security/faillock.conf
    owner: root
    group: root
    mode: "0644"

# Ageing policy for accounts created from now on.
- name: Set password ageing defaults for new accounts
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^#?\\s*{{ item.key }}\\s"
    line: "{{ item.key }}\t{{ item.value }}"
    state: present
  loop:
    - { key: "PASS_MAX_DAYS", value: "{{ cis_password_max_days }}" }
    - { key: "PASS_MIN_DAYS", value: "{{ cis_password_min_days }}" }
    - { key: "PASS_WARN_AGE", value: "{{ cis_password_warn_age }}" }
    # yescrypt is the Ubuntu 22.04+ default and is stronger than SHA512.
    - { key: "ENCRYPT_METHOD", value: "yescrypt" }
    # 077 means new files are readable only by their owner.
    - { key: "UMASK", value: "077" }
  loop_control:
    label: "{{ item.key }}"

- name: Set the default inactive period for new accounts
  ansible.builtin.command: "useradd -D -f {{ cis_password_inactive_days }}"
  register: cis_useradd_default
  changed_when: cis_useradd_default.rc == 0
  check_mode: false
  when: not ansible_check_mode

# login.defs only governs accounts created afterwards. Existing accounts keep
# whatever ageing they were made with, so they are updated explicitly. Root and
# system accounts (UID < 1000) are left alone: expiring root's password can lock
# an administrator out of single user recovery.
- name: Find existing human accounts
  ansible.builtin.getent:
    database: passwd

- name: Apply ageing policy to existing human accounts
  ansible.builtin.command: >-
    chage --maxdays {{ cis_password_max_days }}
          --mindays {{ cis_password_min_days }}
          --warndays {{ cis_password_warn_age }}
          {{ item.key }}
  loop: "{{ ansible_facts.getent_passwd | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.value[1] | int >= 1000
    - item.value[1] | int < 65534
    - not ansible_check_mode
  changed_when: true

# Locks any account with no password set, so an empty password can never be used
# to log in. The search has to run before the lock task that consumes it.
- name: Find accounts with an empty password
  ansible.builtin.shell:
    cmd: "awk -F: '($2 == \"\") { print $1 }' /etc/shadow"
  register: cis_empty_password_accounts
  changed_when: false
  check_mode: false

- name: Lock accounts with an empty password
  ansible.builtin.command: "passwd -l {{ item }}"
  loop: "{{ cis_empty_password_accounts.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: not ansible_check_mode
  changed_when: true
