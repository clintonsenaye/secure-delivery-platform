; Copy to hosts.ini and edit. hosts.ini is gitignored.
;
; These are the Ubuntu hosts around the platform: bastions, self hosted CI
; runners, self managed VMs. NOT the EKS managed nodes, which run Amazon Linux
; from an AMI you do not log into. See docs/architecture.md.

[bastion]
bastion-01 ansible_host=10.0.0.10

[runners]
runner-01 ansible_host=10.0.32.20
runner-02 ansible_host=10.0.48.20

[hardened:children]
bastion
runners

[hardened:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3

; No passwords, no vault secrets and no access keys live in this file.
; Authentication is by SSH key only, which is exactly what the role enforces.
