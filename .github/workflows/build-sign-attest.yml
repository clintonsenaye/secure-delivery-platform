---
##############################################################################
# build-sign-attest
## Pipeline first executed against main on 6 August 2026.
# Chapter 3. The pipeline that lets the cluster refuse everything else.
#
# THE CLAIM THIS WORKFLOW EXISTS TO BACK UP:
#
#   The cluster will not run an image unless it can prove that THIS repository's
#   pipeline built it, from THIS repository's source, and that nobody has touched
#   the bytes since.
#
# Signing is the easy half. The half that matters is the gate, and the gate is in
# policies/. This file produces the evidence the gate checks.
#
# THREE JOBS, THREE DIFFERENT SETS OF PERMISSIONS.
#
#   gate    scans. Runs on every pull request. Holds NO cloud credential at all.
#   build   builds, pushes, signs, attests. Runs only on main.
#   deploy  opens a PULL REQUEST recording the digest. Cannot merge it.
#
# Splitting them is not tidiness. A pull request run receives an OIDC subject
# claim ending in `:pull_request`, and the IAM trust policy in
# terraform/modules/github_oidc only accepts one ending in `:ref:refs/heads/main`.
# (Both claims begin with the repository's immutable identifier form,
# `repo:OWNER@OWNER-ID/NAME@REPO-ID`. See docs/architecture.md section 29.)
# So a pull request CANNOT obtain AWS credentials. That is enforced by the shape
# of the claim rather than by an `if` in this file, which is the stronger place
# to enforce it: an `if` can be edited in the same pull request it is meant to
# constrain.
#
# EVERY ACTION IS PINNED TO A FULL COMMIT SHA.
#
# `actions/checkout@v4` is a mutable tag. A tag is a pointer, and pointers move.
# A supply chain security pipeline that trusts mutable tags for its own
# dependencies is arguing against itself, and it is the first thing anyone
# reading this file should check. The version number is in the trailing comment
# so the pin is still readable; the SHA is what is enforced.
#
# WHAT NEEDS TO BE CONFIGURED, ONCE
#
#   Repository variable AWS_ROLE_ARN   `make ci-config` prints it after
#                                      `make apply ENV=ci`
#   Repository variable AWS_REGION     optional, defaults to eu-west-2
#
# THERE IS NO REPOSITORY SECRET. NOT ONE. That is not an accident and it is not
# a gap: it is the property chapters 1 and 2 spent their whole length building,
# and chapter 3 declined to spend it.
#
# There is no AWS access key, because JOB 2 proves its identity instead of
# presenting one. There is no signing key, because JOB 2 signs keylessly. And
# there is no token for the deploy job beyond the GITHUB_TOKEN GitHub mints for
# the run, which expires with it.
#
# The cost of that last one is a manual step, explained at the end of JOB 3, and
# it was chosen deliberately over storing a GitHub App private key. See
# docs/architecture.md section 30 for the five options and why this is the right
# one at this volume and the wrong one at scale.
##############################################################################

name: build-sign-attest

on:
  push:
    branches: [main]
    paths-ignore:
      # THE LOOP GUARD, AND IT IS NOW THE ONLY AUTOMATIC ONE. READ THIS BEFORE
      # CHANGING THE LIST BELOW.
      #
      # The deploy job records the new image digest in platform/manifests/.
      # Without this filter, that change reaching main triggers another build,
      # which produces another digest, which triggers another build. The
      # BUILD_TIME build argument means every rebuild produces different bytes
      # and therefore a different digest, so the loop does not converge.
      #
      # This comment used to say there were two independent guards, the second
      # being that GitHub does not trigger workflows from pushes made with
      # GITHUB_TOKEN. THAT GUARD IS GONE. Since main became protected, the
      # digest arrives by a pull request that a human merges, and a human merge
      # triggers workflows exactly as it should.
      #
      # What still works: for a push to an existing branch GitHub takes a
      # two-dot diff between the old and new tip, so merging a deploy pull
      # request presents exactly one changed file, which is matched here, and no
      # build starts. That holds for merge, squash and rebase merges alike,
      # because the deploy branch always carries exactly one commit touching
      # exactly this path.
      #
      # Where it fails open, both documented by GitHub: a push carrying more
      # than 1,000 commits, and a diff that times out. Neither is reachable by
      # this pipeline's own commits.
      #
      # The practical backstop is that every iteration of a runaway loop would
      # need a human to merge a pull request, so it cannot run away unattended.
      # IF AUTO-MERGE IS EVER ENABLED ON DEPLOY PULL REQUESTS, THAT BACKSTOP
      # DISAPPEARS AND THIS NEEDS A SECOND, EXPLICIT GUARD.
      #
      # One related trap worth not tidying into existence: a workflow skipped by
      # path filtering leaves its checks Pending, which blocks any pull request
      # requiring them. The `pull_request` trigger below deliberately carries no
      # path filter, which is why the gate always runs on a deploy pull request
      # and can actually satisfy the required check.
      - 'platform/manifests/**'
      - 'docs/**'
      - 'evidence/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deny by default, then grant per job. The workflow level default in GitHub is
# to hand every job a broad token; setting it to {} here means a job that
# forgets to declare what it needs gets nothing rather than everything.
permissions: {}

concurrency:
  # Two merges landing close together would otherwise race to rewrite the same
  # line of deployment.yaml, and the loser would quietly overwrite the winner.
  #
  # cancel-in-progress is FALSE on purpose. Cancelling a half finished run could
  # leave an image pushed and signed but never recorded in Git, which is
  # confusing rather than dangerous, and the queue here is never long.
  group: build-sign-attest-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}

  # The repository name inside ECR. The registry host is not written here: it
  # embeds the AWS account ID and is discovered at run time from the ECR login
  # step, so this file needs no account specific configuration.
  ECR_REPOSITORY_NAME: secure-delivery-ci/app

  # Matches app_tag_prefixes in terraform/environments/ci/main.tf. If you change
  # one, change the other, or the ECR lifecycle policy stops counting your
  # application images and the catch-all rule takes over.
  IMAGE_TAG_PREFIX: sha-

jobs:
  ##########################################################################
  # JOB 1: gate
  #
  # Runs on every pull request and every push. Holds no cloud credential.
  # Nothing downstream runs if this fails, so a leaked secret never reaches a
  # build, let alone a registry.
  ##########################################################################
  gate:
    name: Secret and vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout, with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # fetch-depth: 0 IS LOAD BEARING.
          #
          # The default is a shallow clone of one commit. Gitleaks would then
          # scan that single commit, find nothing, and report success. A secret
          # committed last March and removed in April is still in the history and
          # still valid; the whole reason to scan history rather than the working
          # tree is that `git rm` does not unpublish anything.
          fetch-depth: 0

      - name: Install gitleaks, verifying the download
        env:
          # Pinned, and the checksum is checked. The upstream gitleaks binary is
          # used directly rather than the marketplace action, for two reasons:
          # the action is proprietary and requires a licence key for
          # organisation owned repositories, and running the binary means one
          # fewer piece of third party JavaScript executing with access to this
          # job's token.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 -o gitleaks.tar.gz "$url"
          # Verifying the checksum of your secret scanner is not paranoia in a
          # chapter about verifying artefacts. It would be odd not to.
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Gitleaks secret scan over the whole history
        run: |
          set -euo pipefail
          # --redact so a finding does not print the secret into a public build
          # log, which would publish it far more effectively than the commit did.
          # --log-opts=--all covers every ref, not just the checked out branch.
          gitleaks git . \
            --redact \
            --verbose \
            --exit-code 1 \
            --log-opts="--all --full-history"

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # vuln reads go.sum and reports known CVEs in dependencies.
          # secret is a second, differently implemented opinion alongside
          # gitleaks. They disagree often enough to be worth running both, which
          # is the same argument docs/architecture.md section 11 makes for
          # running Checkov and Trivy over the Terraform.
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          # STRICT HERE, deliberately. Unlike the image scan below, this one does
          # not pass --ignore-unfixed: a vulnerable dependency with no upstream
          # fix is still a decision someone should make consciously, and the
          # place to record that decision is .trivyignore.yaml, which is the
          # accepted risk register this project already keeps.
          trivyignores: .trivyignore.yaml

  ##########################################################################
  # JOB 2: build
  #
  # Builds, pushes, scans, attests and signs. This is the only job that ever
  # holds an AWS credential, and that credential is a one hour STS session
  # obtained by proving identity, not a stored key.
  ##########################################################################
  build:
    name: Build, sign and attest
    needs: gate
    # Belt to the trust policy's braces. Even if this condition were removed, a
    # pull request run could not assume the AWS role.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # The OIDC token. Used TWICE and for two different purposes, which is the
      # neat part of this design:
      #   1. exchanged with AWS STS for temporary credentials
      #   2. presented to Fulcio to obtain a ten minute signing certificate
      # The same proof of identity replaces both a stored cloud key and a stored
      # signing key.
      id-token: write
      contents: read
      # Required by actions/attest-build-provenance to record the attestation
      # against the repository.
      attestations: write

    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      ####################################################################
      # STEP 2 of the chapter brief: authenticate to AWS with no stored key.
      ####################################################################
      - name: Assume the AWS role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          # There is no AWS_ACCESS_KEY_ID and no AWS_SECRET_ACCESS_KEY, here or
          # in repository secrets. GitHub mints a short lived OIDC token
          # asserting which repository, which branch and which workflow is
          # running; AWS validates it against the registered identity provider
          # and hands back a one hour session.
          #
          # This is exactly the mechanism chapter 1 used between the EKS cluster
          # and IAM, pointed at GitHub instead. See docs/architecture.md
          # section 8, then section 25.
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # Appears in CloudTrail, so an ECR push can be traced back to the exact
          # workflow run that made it without correlating timestamps by hand.
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6

      - name: Work out the image reference
        id: meta
        run: |
          set -euo pipefail
          registry="${{ steps.ecr.outputs.registry }}"
          image="${registry}/${ECR_REPOSITORY_NAME}"
          # Twelve characters rather than seven. Seven character abbreviations
          # already collide in large repositories, and a tag that collides in an
          # IMMUTABLE registry is a push that fails at three in the morning.
          tag="${IMAGE_TAG_PREFIX}$(git rev-parse --short=12 HEAD)"
          # Linked into the binary and reported at /version. It also means a
          # re-run of this workflow on the same commit produces different bytes
          # and therefore a different digest, which happens to sidestep the one
          # case where cosign would need to update an existing signature tag.
          # Convenient rather than designed, and noted so it is not mistaken for
          # a guarantee.
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "image=${image}"
            echo "tag=${tag}"
            echo "built=${built}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${image}:${tag}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      ####################################################################
      # STEP 3: build, push, and capture the DIGEST.
      #
      # The digest is the only identifier used from this point on. The tag
      # exists so a human can find the image in the console; nothing in the
      # signing, attestation, verification or deployment path ever refers to
      # it. See docs/architecture.md section 24 for why that distinction is
      # the whole chapter.
      ####################################################################
      - name: Build and push to ECR
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: app/src
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          # One platform, so the push produces a single image manifest with a
          # single digest. A multi platform build produces an image INDEX whose
          # digest covers several manifests, and signing an index rather than an
          # image is a subtly different thing that admission policies handle
          # inconsistently. One architecture is what this project needs, so the
          # complication is avoided rather than managed.
          platforms: linux/amd64

          # BuildKit's own inline provenance and SBOM attestations are turned
          # OFF, and this is not a step backwards.
          #
          # When they are on, BuildKit wraps the image in an index containing the
          # image plus attestation manifests, which changes the digest that gets
          # pushed and reintroduces the index problem above. This workflow
          # generates its own SBOM with syft and its own provenance with the
          # GitHub attestation action, both of which attach to the image by
          # digest and are verifiable by Kyverno. Two sources of attestation
          # would be one more than anyone can reason about.
          provenance: false
          sbom: false

          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.built }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      ####################################################################
      # STEP 4: scan what was actually pushed, by digest.
      #
      # THE OBVIOUS OBJECTION: you pushed before you scanned, so a vulnerable
      # image now exists in the registry.
      #
      # True, and accepted. Building into the local daemon and pushing
      # afterwards does not compose cleanly with attestations, and the
      # mitigation is complete rather than partial: if this step fails, the job
      # fails, the digest is never written into platform/manifests/, and
      # nothing deploys it. The image sits in ECR referenced by nothing and is
      # expired by the lifecycle policy. An unreferenced image in a private
      # registry is not a running workload.
      ####################################################################
      - name: Trivy scan of the pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          # --ignore-unfixed, unlike the filesystem scan.
          #
          # A finding with no upstream patch cannot be acted on by this pipeline.
          # Failing every build on it does not make the image safer; it makes the
          # gate something people learn to bypass, and a control everyone routes
          # around is worse than no control because it still reports green.
          #
          # The honest cost: an unfixed CRITICAL in the base image will not stop
          # a deployment. The compensating controls are the distroless base,
          # which has almost no packages to be vulnerable, and the fact that this
          # is recorded here rather than discovered.
          ignore-unfixed: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      ####################################################################
      # STEP 5: SBOM, attached as a signed attestation.
      #
      # An SBOM in a build artifact is a file nobody reads. An SBOM attached to
      # the image as a signed attestation is a claim that travels with the
      # artefact and can be verified by whoever ends up running it. When the
      # next log4j happens, the question "are we affected" becomes a query
      # against the registry rather than an investigation.
      ####################################################################
      - name: Generate the CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach the SBOM as a cosign attestation
        env:
          COSIGN_YES: 'true'
          IMAGE_REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Keyless. No --key argument, because there is no key. cosign generates
          # an ephemeral keypair in memory, presents this job's OIDC token to
          # Fulcio, receives a ten minute certificate binding the public key to
          # this workflow's identity, signs, records the event in Rekor, and
          # discards the private key. See docs/architecture.md section 25.
          cosign attest \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            "${IMAGE_REF}"

      ####################################################################
      # STEP 6: sign the image itself, by digest.
      ####################################################################
      - name: Cosign keyless signature
        env:
          COSIGN_YES: 'true'
          IMAGE_REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # BY DIGEST. Never by tag.
          #
          # Signing a tag signs a NAME. Tomorrow that name can point at different
          # bytes and the verification of the name still passes, so the signature
          # answers a question nobody asked. Chapter 2 demonstrated the same
          # class of bug without an attacker: rebuilding under the tag 0.1.0 left
          # the manifest unchanged, so the cluster changed nothing and the pods
          # kept serving the old binary while reporting Synced and Healthy.
          #
          # A digest cannot be repointed, because it IS the content.
          cosign sign "${IMAGE_REF}"

      ####################################################################
      # STEP 7: SLSA build provenance.
      #
      # The signature says WHO built it. The provenance says WHAT was built and
      # FROM WHERE: repository, commit, workflow, runner, timestamp, in a
      # structured format a policy can read rather than a human.
      #
      # It is generated by the build platform rather than by this file, which
      # is the property that makes it worth anything. A provenance document a
      # workflow writes about itself is a self assessment.
      #
      # Because this repository is PUBLIC, GitHub signs the attestation with the
      # public good Sigstore instance, so it lands in the public Rekor
      # transparency log and can be verified by anyone, with no GitHub
      # credential. A private repository would use GitHub's internal Fulcio
      # instead, and the Kyverno policy would need to trust that instead.
      ####################################################################
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          # Stores the attestation alongside the image in ECR as well as in
          # GitHub's attestation store. Kyverno reads it from the registry: the
          # cluster has no GitHub credential and, per chapter 2, is never given
          # one.
          push-to-registry: true

      ####################################################################
      # VERIFY OUR OWN WORK BEFORE ANYTHING DEPENDS ON IT.
      #
      # This step is not ceremony. Without it, a mismatch between what the
      # pipeline signs and what the cluster expects surfaces as pods that will
      # not start, at ArgoCD sync time, with an error about signatures that
      # points at the cluster rather than at the pipeline. Failing here instead
      # turns a confusing production symptom into an obvious build failure.
      #
      # The identity is reconstructed from GitHub context rather than pasted, so
      # this check cannot drift from reality. It CAN drift from the Kyverno
      # policy, which is why the same string is a Terraform output.
      ####################################################################
      - name: Verify the signature and attestations we just made
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/build-sign-attest.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"

          echo "::group::Expected signing identity"
          echo "  identity: ${identity}"
          echo "  issuer:   ${issuer}"
          echo "  image:    ${IMAGE_REF}"
          echo "::endgroup::"

          echo "==> Verifying the image signature"
          cosign verify \
            --certificate-identity="${identity}" \
            --certificate-oidc-issuer="${issuer}" \
            "${IMAGE_REF}" > /dev/null

          echo "==> Verifying the SBOM attestation"
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity="${identity}" \
            --certificate-oidc-issuer="${issuer}" \
            "${IMAGE_REF}" > /dev/null

          echo "==> Verifying the SLSA build provenance"
          gh attestation verify "oci://${IMAGE_REF}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build-sign-attest.yml"

          echo "All three verified against the identity the cluster will require."

      - name: Summary
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Signed image"
            echo
            echo '```'
            echo "${IMAGE_REF}"
            echo '```'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`${{ steps.meta.outputs.tag }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| signed by | \`${GITHUB_WORKFLOW_REF}\` |"
            echo
            echo "Deployed by digest. The tag is for humans and is referenced by nothing."
          } >> "$GITHUB_STEP_SUMMARY"

  ##########################################################################
  # JOB 3: deploy
  #
  # Records the digest in Git by OPENING A PULL REQUEST. It does not push to
  # main, and it cannot: main is protected.
  #
  # WHY THIS JOB LOOKS THE WAY IT DOES.
  #
  # The first version pushed straight to main. That worked until branch
  # protection was turned on, at which point every run failed with GH013,
  # "Changes must be made through a pull request". The gap this closed was the
  # largest one chapter 3 listed: the gate proves an image came from this
  # pipeline, and the pipeline builds whatever is on main, so requiring review
  # before merge is what makes "from this repository" mean anything.
  #
  # There were two ways to make the pipeline work again. One was to exempt it
  # from the rule, by adding the Actions bot to the ruleset bypass list or by
  # pointing ArgoCD at an unprotected branch. The other was to make it follow
  # the rule, like a human. This is the second. The reasoning, and why the first
  # two were rejected, is docs/architecture.md section 30.
  #
  # NOTE WHAT IS STILL ABSENT. No kubectl, no kubeconfig, no cluster endpoint,
  # no inbound path to any cluster. Chapter 2's argument holds in full: the
  # pipeline does not deploy, it proposes a commit, and the cluster pulls. See
  # docs/architecture.md section 17.
  #
  # What HAS changed is the strength of the concession in chapter 2's rebuttal
  # 4. That said the pipeline still needs Git write access to bump image tags,
  # and consoled itself that Git write is auditable and constrainable with
  # branch protection. It is now actually constrained: this job can create a
  # branch and open a pull request, and it cannot merge one.
  #
  # THE TOKEN PROBLEM, WHICH IS THE NON OBVIOUS PART, AND THE MANUAL STEP.
  #
  # GitHub deliberately does not trigger workflows from events caused by
  # GITHUB_TOKEN, to stop workflows recursing. That is the same behaviour this
  # file relies on as a loop guard at the top. It also means a pull request
  # opened with GITHUB_TOKEN never triggers the gate, so the required check sits
  # at "Expected, waiting" and the pull request cannot be merged as it stands.
  #
  # THE FIX IS TWO CLICKS, NOT A CREDENTIAL. Closing and reopening the pull
  # request produces a `reopened` event attributed to a person rather than to
  # the token, the gate runs, and the pull request becomes mergeable. The last
  # step of this job prints that instruction with the URL.
  #
  # The alternative was a GitHub App, whose installation token does trigger
  # workflows, at the cost of storing its private key as a repository secret.
  # That is what a team deploying many times a day should do. At one deploy every
  # few days it is a poor trade: a permanent stored credential to save two
  # clicks, in a project whose entire argument is that stored credentials are the
  # thing to design away. All five options are set out in docs/architecture.md
  # section 30.
  ##########################################################################
  deploy:
    name: Propose the digest as a pull request
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # Enough to push a deploy/* branch and open a pull request against main.
      # Deliberately NOT enough to merge one, and there is no id-token, so this
      # job cannot reach AWS at all.
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          # Needed so the deploy branch can be rebased onto a main that moved
          # while this run was building.
          fetch-depth: 0
          # The default GITHUB_TOKEN, which is what the later git push
          # authenticates with. It expires when the run ends and exists nowhere
          # else.
          persist-credentials: true

      - name: Rewrite the deployment to the new digest
        id: rewrite
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          command -v yq >/dev/null || {
            echo "yq is not on this runner image"; exit 1; }

          manifest=platform/manifests/demo-app/deployment.yaml
          ref="${IMAGE}@${DIGEST}"

          # Three fields, and all three matter.
          #
          #   image        what the kubelet pulls. A digest, so it pulls exactly
          #                the bytes that were signed and verified.
          #   IMAGE_REF    reported at /version.
          #   IMAGE_DIGEST reported at /version. Chapter 2 shipped this endpoint
          #                already reporting "unset", with a comment saying
          #                chapter 3 would fill it in. This is that line.
          yq -i "
            (.spec.template.spec.containers[] | select(.name == \"demo-app\") | .image) = \"${ref}\" |
            (.spec.template.spec.containers[] | select(.name == \"demo-app\") | .env[] | select(.name == \"IMAGE_REF\")    | .value) = \"${ref}\" |
            (.spec.template.spec.containers[] | select(.name == \"demo-app\") | .env[] | select(.name == \"IMAGE_DIGEST\") | .value) = \"${DIGEST}\"
          " "$manifest"

          echo "::group::Resulting image reference"
          yq '.spec.template.spec.containers[0].image' "$manifest"
          echo "::endgroup::"

          # A tag reference here would silently undo the entire chapter.
          grep -q "@sha256:" "$manifest" || {
            echo "deployment.yaml does not reference an image by digest. Refusing to commit."
            exit 1
          }

          # THE CLEAN NO-OP. Unchanged behaviour from the push based version:
          # a rebuild that resolves to the digest already deployed is success,
          # not failure, and must not open an empty pull request.
          if git diff --quiet -- platform/manifests/; then
            echo "Digest unchanged. Nothing to propose."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      ####################################################################
      # Reuse an open deploy pull request rather than stacking a second one.
      #
      # Matching is on the head branch prefix rather than on a label, because a
      # label would have to be created first and that needs a wider permission
      # than this job otherwise wants.
      #
      # Reusing means the deploy branch always holds exactly ONE commit on top
      # of current main, carrying the current digest. Superseding a digest that
      # was never merged is the normal case: builds are faster than reviews.
      ####################################################################
      - name: Find an open deploy pull request
        id: find
        if: steps.rewrite.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --state open --base main \
            --json number,headRefName,url \
            --jq '[.[] | select(.headRefName | startswith("deploy/"))][0] // empty')

          if [ -n "$existing" ]; then
            number=$(echo "$existing" | jq -r '.number')
            branch=$(echo "$existing" | jq -r '.headRefName')
            echo "Reusing open deploy pull request #${number} on ${branch}."
            echo "number=${number}" >> "$GITHUB_OUTPUT"
          else
            branch="deploy/${TAG}"
            echo "No open deploy pull request. Will create ${branch}."
            echo "number=" >> "$GITHUB_OUTPUT"
          fi
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Commit and push the deploy branch
        if: steps.rewrite.outputs.changed == 'true'
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ needs.build.outputs.tag }}
          BRANCH: ${{ steps.find.outputs.branch }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --create "$BRANCH"

          # The body is built with printf rather than a heredoc, because a
          # heredoc inside an indented YAML block needs its terminator at column
          # zero and is a reliable way to produce a shell error that reads like a
          # YAML error.
          body=$(printf '%s\n' \
            "image:  ${IMAGE}@${DIGEST}" \
            "source: ${GITHUB_SHA}" \
            "run:    ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "" \
            "Deployed by digest, never by tag. Once merged, ArgoCD picks this up" \
            "on its next reconciliation and Kyverno verifies the signature at" \
            "admission before a pod is scheduled.")

          git add platform/manifests/demo-app/deployment.yaml
          git commit --message "deploy: demo-app ${TAG}" --message "${body}"

          # Give --force-with-lease something to compare against when the branch
          # already exists remotely. Without a remote-tracking ref it refuses
          # with "stale info", which the classifier below treats as a race.
          git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null || true

          ##############################################################
          # PUSH, WITH FAILURES CLASSIFIED RATHER THAN COUNTED.
          #
          # The previous version retried three times on ANY failure and
          # rebased between attempts. That is right for exactly one cause,
          # a concurrent merge, and wrong for every other. When branch
          # protection started refusing the push, it produced three
          # identical GH013 errors and a closing line about rebasing, which
          # actively pointed the reader away from the cause.
          #
          # A rule violation is a statement about what you are allowed to
          # do. It does not become true on the third attempt, and rebasing
          # cannot make it true. Retrying it wastes time and, worse, buries
          # the one useful line of output under two copies of itself.
          #
          # So: races are retried, refusals fail immediately with an
          # explanation, and anything unrecognised fails immediately rather
          # than being retried hopefully.
          ##############################################################
          attempt=1
          max_attempts=3

          while : ; do
            if push_output=$(git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}" 2>&1); then
              echo "$push_output"
              echo "Pushed ${BRANCH} on attempt ${attempt}."
              break
            fi

            echo "$push_output"

            case "$push_output" in
              *GH013*|*"protected branch"*|*"Protected branch update failed"*|*"Changes must be made through a pull request"*|*"required status check"*|*"review is required"*)
                echo "::error title=Push refused by a repository rule::Branch protection rejected the push. This is terminal."
                echo ""
                echo "A ruleset refusal is not a race, and rebasing cannot resolve it."
                echo "Not retrying."
                echo ""
                echo "This job pushes to a deploy/* branch and opens a pull request;"
                echo "it never pushes to main. If a rule is refusing THAT push, the"
                echo "ruleset covers more refs than intended. Check whether its"
                echo "target pattern is something like ** rather than main, and"
                echo "whether it excludes deploy/*."
                exit 1
                ;;

              *"Authentication failed"*|*"could not read Username"*|*"remote: Permission"*|*"403 Forbidden"*)
                echo "::error title=Push rejected on credentials::The token could not write to this repository. This is terminal."
                echo ""
                echo "The workflow permissions block above grants contents: write,"
                echo "so a failure here usually means an organisation policy or a"
                echo "ruleset overrides it for this ref."
                exit 1
                ;;

              *"non-fast-forward"*|*"fetch first"*|*"stale info"*|*"cannot lock ref"*|*"failed to lock"*)
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "::error title=Lost the race ${max_attempts} times::main kept moving underneath this run."
                  echo "Re-run the job. This is genuinely transient."
                  exit 1
                fi
                echo "Concurrent update detected. Rebasing onto main and retrying."
                git fetch origin main
                git rebase origin/main || {
                  echo "::error title=Rebase failed::The digest rewrite conflicts with main."
                  echo "That should be impossible for a single generated line, so"
                  echo "something else is editing the image reference by hand."
                  exit 1
                }
                git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null || true
                attempt=$((attempt + 1))
                continue
                ;;

              *)
                echo "::error title=Unrecognised push failure::Not retrying."
                echo ""
                echo "The output above is the whole of what git said. It was not"
                echo "recognised as either a rule refusal or a race, and retrying"
                echo "an unknown failure just produces the same message three"
                echo "times. If this turns out to be transient, add its signature"
                echo "to the race branch of the classifier in this file."
                exit 1
                ;;
            esac
          done

      - name: Open or update the pull request
        id: pr
        if: steps.rewrite.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ needs.build.outputs.tag }}
          BRANCH: ${{ steps.find.outputs.branch }}
          PR_NUMBER: ${{ steps.find.outputs.number }}
        run: |
          set -euo pipefail

          title="deploy: demo-app ${TAG}"

          body=$(printf '%s\n' \
            "Records the digest of a signed image so ArgoCD deploys it." \
            "" \
            "| | |" \
            "|---|---|" \
            "| image | \`${IMAGE}@${DIGEST}\` |" \
            "| tag | \`${TAG}\` |" \
            "| digest | \`${DIGEST}\` |" \
            "| source commit | ${GITHUB_SHA} |" \
            "| build run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |" \
            "" \
            "The image was scanned, signed with a keyless Cosign signature, and" \
            "attested with a CycloneDX SBOM and SLSA build provenance. The build" \
            "job verified all three against this repository's workflow identity" \
            "before opening this pull request." \
            "" \
            "**Deployed by digest, never by tag.** On merge, ArgoCD reconciles" \
            "within about 30 seconds and Kyverno verifies the signature at" \
            "admission before a pod is scheduled. Verify independently with:" \
            "" \
            "\`\`\`bash" \
            "make ci-config   # prints the certificate identity to paste below" \
            "" \
            "cosign verify \\" \
            "  --certificate-identity=\"<identity from make ci-config>\" \\" \
            "  --certificate-oidc-issuer=\"https://token.actions.githubusercontent.com\" \\" \
            "  ${IMAGE}@${DIGEST}" \
            "\`\`\`" \
            "" \
            "Opened automatically. It goes through review like any other change:" \
            "the delivery automation follows the same branch protection rule a" \
            "human does rather than being exempted from it. See" \
            "docs/architecture.md section 30.")

          if [ -n "${PR_NUMBER}" ]; then
            gh pr edit "${PR_NUMBER}" --title "${title}" --body "${body}"
            url=$(gh pr view "${PR_NUMBER}" --json url --jq '.url')
            echo "Updated pull request #${PR_NUMBER}: ${url}"
            echo "action=updated" >> "$GITHUB_OUTPUT"
          else
            url=$(gh pr create --base main --head "${BRANCH}" \
              --title "${title}" --body "${body}")
            echo "Opened ${url}"
            echo "action=opened" >> "$GITHUB_OUTPUT"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      ####################################################################
      # THE MANUAL STEP. This is the normal path, not a degraded one.
      #
      # GitHub does not trigger workflows from events caused by GITHUB_TOKEN,
      # so the gate has not started on the pull request just opened and will
      # not start on its own. Reopening it produces an event attributed to a
      # person, which does trigger it.
      #
      # This job could have avoided the manual step by opening the pull request
      # as a GitHub App, at the cost of storing the App's private key as a
      # repository secret. That trade was declined: see docs/architecture.md
      # section 30. So the instruction is printed clearly, with the URL, every
      # time, rather than being something to remember.
      ####################################################################
      - name: What to do next
        if: steps.rewrite.outputs.changed == 'true'
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          {
            echo "### Two clicks to finish this deploy"
            echo
            echo "**${PR_URL}**"
            echo
            echo "The **Secret and vulnerability gate** check has not started on"
            echo "that pull request, and will not start on its own. GitHub does"
            echo "not trigger workflows from events caused by \`GITHUB_TOKEN\`,"
            echo "which is what opened it."
            echo
            echo "**Close the pull request, then reopen it.** The reopen event"
            echo "comes from you rather than from the token, the gate runs, and"
            echo "the pull request becomes mergeable. Review the diff and merge."
            echo
            echo "This is deliberate. The alternative was storing a GitHub App"
            echo "private key so the automation could trigger its own checks."
            echo "At this deploy volume, two clicks is a better trade than a"
            echo "permanent stored credential in a project whose whole argument"
            echo "is that stored credentials are the thing to design away."
            echo "See \`docs/architecture.md\` section 30."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Close and reopen the pull request to run the gate::${PR_URL}"

      - name: Summary
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          {
            if [ "${{ steps.rewrite.outputs.changed }}" != "true" ]; then
              echo "### No change"
              echo
              echo "The manifest already references \`${DIGEST}\`."
              echo "Nothing to propose, and that is success rather than failure."
            else
              echo
              echo "---"
              echo
              echo "Deploy pull request ${{ steps.pr.outputs.action }} for"
              echo "\`${IMAGE}@${DIGEST}\`"
              echo
              echo "This pipeline does not deploy. It proposes a commit, a human"
              echo "merges it, and the cluster pulls. **It holds no stored"
              echo "credential of any kind**: no AWS access key, no signing key,"
              echo "no App key, and a GITHUB_TOKEN that expires with this run and"
              echo "cannot write to \`main\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
